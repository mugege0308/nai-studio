name: Update Japanese tag dictionary

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tag-dictionary
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, validate and shard
        run: python scripts/update_tag_dictionary.py
      - name: Commit only changed dictionary files
        run: |
          git config user.name "nai-studio-tagdb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tagdb/manifest.json data/tagdb/tags-*.json
          if git diff --cached --quiet; then
            echo "No dictionary changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: update Japanese tag dictionary"
          git push origin HEAD:main
